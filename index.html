<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glosas Lótus by Pantheon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: relatório de página única, coluna de leitura de 1120px; resumo → motivos → convênios → médicos → procedimentos → ação → guias */
:root{
 --bg:#F7F4F7;--surface:#FFFFFF;--ink:#26142B;--muted:#6E5F73;--line:#E6DDE7;--soft:#F1EAF2;
 --accent:#5B1D5C;--accent-soft:#F0E4F1;--gold:#B8892E;--gold-soft:#F6EBD3;--loss:#B23B36;--loss-soft:#F8E4E1;--warn:#A0761C;--ok:#2E7A4F;
 --brand:#481346;--brand-ink:#FFFFFF;--brand-muted:#C9B3CA;--brand-hover:#5A2158;
 --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;--f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150A17;--surface:#1F1222;--ink:#F2EAF3;--muted:#AE9CB2;--line:#36253B;--soft:#2A1A2F;--accent:#D9AEDC;--accent-soft:#3B2141;--gold:#DDB560;--gold-soft:#3A2E17;--loss:#EF8C7B;--loss-soft:#40201E;--warn:#DDB25A;--ok:#6CC08F;--brand:#2E0C2D;--brand-hover:#43173F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150A17;--surface:#1F1222;--ink:#F2EAF3;--muted:#AE9CB2;--line:#36253B;--soft:#2A1A2F;--accent:#D9AEDC;--accent-soft:#3B2141;--gold:#DDB560;--gold-soft:#3A2E17;--loss:#EF8C7B;--loss-soft:#40201E;--warn:#DDB25A;--ok:#6CC08F;--brand:#2E0C2D;--brand-hover:#43173F;color-scheme:dark}
/* Pantheon e Lótus: bege claro em qualquer tema do sistema */
html:root[data-clinic="pantheon"],html:root[data-clinic="lotus"]{--bg:#F8F2E8;--surface:#FFFDF9;--ink:#26142B;--muted:#6E5F73;--line:#E8DDCC;--soft:#F1E8DA;--accent:#5B1D5C;--accent-soft:#F0E4F1;--gold:#B8892E;--gold-soft:#F6EBD3;--loss:#B23B36;--loss-soft:#F8E4E1;--warn:#A0761C;--ok:#2E7A4F;--brand:#481346;--brand-hover:#5A2158;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;background:var(--brand);color:var(--brand-ink);padding:28px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.side .brand{padding:0 6px 18px;border-bottom:1px solid rgba(221,181,96,.45);display:flex;flex-direction:column;gap:12px}
.side .brand img{display:block;width:100%;height:auto}
.side .brand span{font-family:var(--f-data);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#nav{display:flex;flex-direction:column;gap:2px}
.side .ng{font-family:var(--f-data);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-muted);padding:12px 10px 6px}
.side a{display:block;padding:9px 10px;border-radius:5px;color:var(--brand-ink);border-left:2px solid transparent;text-decoration:none;font-size:.9rem}
.side a:hover{background:var(--brand-hover)}
.side a[aria-current="page"]{background:var(--brand-hover);color:#fff;font-weight:600;border-left-color:var(--gold)}
.side a:focus-visible{outline-color:var(--gold)}
h1 .per{display:block;font-size:.5em;color:var(--gold);margin-top:6px;font-weight:600}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.side{min-width:0;position:static;height:auto;padding:14px 16px;gap:10px;flex-direction:column;align-items:stretch;overflow:visible}.side .brand{padding:0 0 12px;flex-direction:row;align-items:center;justify-content:space-between}.side .brand img{width:150px}#nav{flex-direction:row;align-items:center;gap:4px;overflow-x:auto;min-width:0}.side .ng{padding:0 6px 0 0;white-space:nowrap}.side a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.side a[aria-current="page"]{border-bottom-color:var(--gold)}}
.wrap{max-width:1120px;width:100%;margin:0 auto;padding-inline:20px;padding-block:40px 80px;display:flex;flex-direction:column;gap:56px;min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,5.4vw,3.8rem);line-height:1.02;font-weight:600}
h2{font-size:2rem;line-height:1.1;font-weight:600}
h3{font-size:1.15rem}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--f-data);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-data)}
.muted{color:var(--muted)}
header{display:flex;flex-direction:column;gap:14px;padding-bottom:28px;border-bottom:2px solid var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.85rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
section{display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;flex-direction:column;gap:6px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.loss .v{color:var(--loss)}
.gauge{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;background:var(--loss)}
/* lead */
.lead{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.lead{grid-template-columns:1fr}}
.callout{background:var(--loss-soft);border-radius:6px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.callout .big{font-family:var(--f-display);font-size:3rem;font-weight:600;font-variant-numeric:lining-nums;line-height:1;color:var(--loss)}
.findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.findings li{display:flex;flex-direction:column;gap:3px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.findings li:last-child{border-bottom:0;padding-bottom:0}
.findings .ft{font-weight:600;color:var(--ink)}
.findings li span:last-child{color:var(--muted);font-size:.92rem}
.findings b{color:var(--ink)}
/* bars */
.bars{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 0}
.bar{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) 110px 64px;gap:14px;align-items:center;padding:8px 18px}
.bar:hover{background:var(--soft)}
.bar .lab{min-width:0;display:flex;flex-direction:column}
.bar .lab b{font-weight:500;font-size:.9rem;overflow-wrap:anywhere}
.bar .lab span{font-size:.75rem;color:var(--muted)}
.track{height:12px;background:var(--soft);border-radius:2px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--loss);border-radius:2px}
.track i.c{background:var(--accent);opacity:.28}
.bar .val{text-align:right;font-family:var(--f-data);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar .pct{text-align:right;font-family:var(--f-data);font-size:.78rem;color:var(--muted)}
.bar.head{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-block:4px 6px;border-bottom:1px solid var(--line)}
.bar.head:hover{background:none}
@media (max-width:640px){.bar{grid-template-columns:minmax(0,1fr) 92px;row-gap:6px}.bar .track{grid-column:1/-1;grid-row:2}.bar .pct{display:none}}
.chip{display:inline-block;font-family:var(--f-data);font-size:.68rem;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.doc{background:var(--loss-soft);color:var(--loss)}
.chip.aud{background:#0000;border:1px solid var(--warn);color:var(--warn)}
.chip.cod{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.78rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.two>*{min-width:0}
/* heat */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--surface);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
td.n{font-family:var(--f-data)}
.heat td.h{font-family:var(--f-data);font-size:.76rem}
/* month chart */
svg text{fill:var(--muted);font-family:var(--f-data);font-size:11px}
/* actions */
.actions{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.act{display:grid;grid-template-columns:44px minmax(0,1fr) 130px;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.act .ix{font-family:var(--f-display);font-size:1.9rem;font-weight:600;color:var(--gold);line-height:1}
.act .amt{text-align:right;font-family:var(--f-data);color:var(--loss);font-variant-numeric:tabular-nums}
.act .amt small{display:block;color:var(--muted);font-size:.72rem}
.act p{font-size:.9rem;color:var(--muted);margin-top:4px}
@media (max-width:600px){.act{grid-template-columns:32px minmax(0,1fr)}.act .amt{grid-column:2;text-align:left}}
/* explorer */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0;flex:1 1 170px}
select,input,button{font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;max-width:100%}
button{cursor:pointer;background:var(--ink);color:var(--bg);border-color:var(--ink);flex:0 0 auto}
button.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sumline{font-size:.85rem;color:var(--muted)}
.sumline b{color:var(--ink);font-family:var(--f-data);font-weight:500}
#gt tbody tr.g{cursor:pointer}
#gt tbody tr.g:hover td{background:var(--soft)}
#gt tr.sub td{background:var(--bg);font-size:.78rem;color:var(--muted);border-bottom-style:dashed}
#gt tr.sub td:first-child{padding-left:28px}
#gt td.desc{white-space:normal;min-width:240px;text-align:left}
#gt th.sort{cursor:pointer}
.caret{display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
tr.open .caret{transform:rotate(90deg)}
.more{align-self:center}
.sits{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.sit{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:3px solid var(--c)}
.sit .v{font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;color:var(--c)}
.sit .row{display:flex;justify-content:space-between;gap:10px;font-size:.82rem}
.sit .row span:last-child{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.sit ul{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.sit li.lh{font-family:var(--f-data);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.sit li{display:flex;justify-content:space-between;gap:10px}
.sit li span:first-child{min-width:0;overflow-wrap:break-word}
.sit li.cv{flex-direction:column;gap:1px}
.sit li.cv span:last-child{color:var(--ink);white-space:normal}
.sit li span:last-child{font-family:var(--f-data);white-space:nowrap}
.chip.pc{background:var(--accent-soft);color:var(--accent)}
.chip.pn{background:#0000;border:1px solid var(--accent);color:var(--accent)}
.chip.oc{background:var(--soft);color:var(--ink)}
.chip.vf,.chip.vp{background:#0000;border:1px solid var(--warn);color:var(--warn)}
#ot td.ev{white-space:normal;text-align:left;min-width:260px;font-size:.78rem;color:var(--muted)}
#ot td.ev b{color:var(--ink);font-weight:500}
select.env{padding:4px 8px;font-size:.8rem;font-weight:600;border-radius:12px}
select.env.pend{border-color:var(--warn);color:var(--warn)}
select.env.ok{border-color:var(--ok);color:var(--ok)}
.penv{display:flex;flex-direction:column;gap:12px;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:18px 20px}
.penv-h{display:flex;flex-direction:column;gap:4px}
.penv-h .muted{font-size:.82rem}
.penv .scroll{border:0}
.envg{display:flex;align-items:center;gap:6px;margin:2px 0}
.envg .num{font-size:.72rem;color:var(--muted)}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.envst{margin-top:auto;font-size:11.5px;line-height:1.4;color:rgba(255,255,255,.78);padding:10px 6px 0;border-top:1px solid rgba(221,181,96,.3)}.envst.ok::before{content:"● ";color:#86d6a3}.envst.warn::before{content:"● ";color:#E8C46B}@media (max-width:860px){.envst{margin-top:0}}
select.orgsel{padding:4px 8px;font-size:.8rem;font-weight:600;border-radius:12px}select.orgsel.vf{border-color:var(--warn);color:var(--warn)}select.orgsel.pan{border-color:var(--accent);color:var(--accent)}select.orgsel.oc{border-color:var(--ink);color:var(--ink)}
/* ===== layout em abas ===== */
.wrap{gap:28px}
.qtop{display:flex;flex-direction:column;gap:14px}
.kpi.warnk .v{color:var(--warn)}
.kpi .v{transition:color .2s}
.qtabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.qtabs::-webkit-scrollbar{display:none}
.tab{background:transparent;color:var(--muted);border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;transition:background .15s,color .15s}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--brand,#481346);color:#fff}
.tab .cnt{font-family:var(--f-data);font-size:.7rem;background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 7px;font-weight:500}
.tab.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.tab .cnt.warn{background:var(--gold-soft);color:var(--warn)}
.qchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem}
.fchip{background:var(--accent-soft);color:var(--accent);border:1px solid transparent;border-radius:999px;padding:5px 12px;font-size:.8rem}
.fchip b{font-weight:600}
.fchip span{margin-left:4px;opacity:.7}
.fchip:hover{border-color:var(--accent)}
.fchip.clear{background:transparent;color:var(--muted);border-color:var(--line)}
.qbody{display:flex;flex-direction:column;gap:22px;animation:qin .25s ease}
@keyframes qin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.qbody{animation:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .bars{border:0;padding:0;background:transparent}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hint{font-size:.75rem;color:var(--muted)}
.lnk{background:none;border:0;color:var(--accent);padding:0;font-size:.82rem;font-weight:600}
.lnk:hover{text-decoration:underline}
.lead2{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:stretch}
@media (max-width:900px){.lead2{grid-template-columns:1fr}}
.two{gap:22px}
/* leitura rápida */
.quick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.quick li{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.quick li:last-child{border-bottom:0}
.quick li.go{cursor:pointer;border-radius:6px;padding-inline:8px;margin-inline:-8px}
.quick li.go:hover{background:var(--soft)}
.quick .qh{font-size:.95rem}
.quick .qt{font-size:.84rem;color:var(--muted)}
.quick .lk{color:var(--accent);font-weight:600;white-space:nowrap}
/* barras clicáveis */
button.bar{width:100%;background:transparent;border:0;border-radius:6px;color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:background .15s,opacity .15s}
button.bar:hover{background:var(--soft)}
button.bar.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
button.bar.dim{opacity:.45}
.track i{transition:width .35s ease}
/* barra empilhada */
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.seg{border:0;padding:0;background:var(--c);min-width:4px;cursor:pointer;transition:flex .35s ease,opacity .15s;border-radius:0}
.seg:hover{filter:brightness(1.12)}
.seg.dim,.sl.dim{opacity:.35}
.seg.on{box-shadow:inset 0 0 0 2px var(--ink)}
.sleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.sl{display:grid;grid-template-columns:12px 1fr;grid-template-rows:auto auto auto;column-gap:8px;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.sl:hover{background:var(--soft)}
.sl.on{border-color:var(--accent);background:var(--accent-soft)}
.sl:disabled{opacity:.4;cursor:default}
.sl i{grid-row:1/4;width:12px;height:12px;border-radius:3px;margin-top:4px}
.sl .l{font-size:.82rem;color:var(--muted)}
.sl .g{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.15;font-variant-numeric:lining-nums tabular-nums}
.sl .s{font-size:.74rem;color:var(--muted)}
/* colunas por mês */
.cols{display:flex;gap:8px;align-items:stretch;height:170px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;border-radius:6px;padding:4px 2px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.col:hover{background:var(--soft)}
.col.on{background:var(--accent-soft)}
.col.dim{opacity:.4}
.col .cb{flex:1;width:70%;display:flex;align-items:flex-end}
.col .cb i{display:block;width:100%;background:var(--loss);border-radius:3px 3px 0 0;transition:height .35s ease}
.col .cv{font-family:var(--f-data);font-size:.68rem;color:var(--muted)}
.col .cl{font-family:var(--f-data);font-size:.72rem;color:var(--muted)}
/* pacientes */
.filters label.grow{flex:2 1 240px}
.pbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.pbar .btns{display:flex;gap:8px}
.ptab tbody tr.pr{cursor:pointer}
.ptab tbody tr.pr:hover td{background:var(--soft)}
.ptab tbody tr.pr.open td{background:var(--accent-soft);border-bottom-color:transparent}
.ptab td.cx{width:22px;padding-right:0}
.ptab .pn{font-weight:600}
.ptab tr.det td{background:var(--bg);padding:6px 10px 14px;white-space:normal}
.gdet{display:flex;flex-direction:column;gap:10px}
.gx{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gxh{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--soft);font-size:.8rem}
.gxi{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.6fr) auto 90px 90px;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:.78rem;align-items:center;text-align:left}
.gxi .num{text-align:right}
@media (max-width:760px){.gxi{grid-template-columns:1fr auto}.gxi .m{grid-column:1/-1}}
.stag{display:inline-block;font-size:.68rem;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--c);border:1px solid var(--c);white-space:nowrap}
/* ação */
button.act{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;padding:16px 8px}
button.act:hover{background:var(--soft)}
.actions{border-top:0}
.penv2{border-left:4px solid var(--gold)}
.prog{flex:0 0 200px;height:8px;background:var(--soft);border-radius:999px;overflow:hidden;align-self:center}
.prog i{display:block;height:100%;background:var(--ok);transition:width .35s ease}
/* visão anual em abas */
.atabs-body>section{animation:qin .25s ease}
.kpi .v{font-size:clamp(1.45rem,2.1vw,1.95rem);overflow-wrap:anywhere}
h1{font-size:clamp(2.1rem,4.4vw,3.1rem)}
header{gap:10px;padding-bottom:20px}
.two .bar{grid-template-columns:minmax(0,1fr) 100px 56px;row-gap:6px}
.two .bar .track{grid-column:1/-1;grid-row:2}
.two .bar .lab{grid-row:1}
.two .bar.head{grid-template-columns:minmax(0,1fr) 100px 56px}
.two .bar.head span:nth-child(2){display:none}
.act .amt small+small{color:var(--loss);opacity:.8}
.lostg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.lg{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.lg:hover{background:var(--soft)}
.lg .l{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px}
.lg .l i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg .g{font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.15}
.lg .s{font-size:.74rem;color:var(--muted)}
.lg .d{font-size:.8rem;color:var(--muted);margin-top:4px}
.side .brand .logo-card{background:#fff;border-radius:8px;padding:12px 14px}
@media (max-width:820px){.side .brand .logo-card{padding:6px 10px}.side .brand .logo-card img{width:120px}}
</style>

const ORG={pc:["Pantheon · atendimento confirmado","var(--accent)"],pn:["Pantheon · só pelo nome","var(--accent)"],pv:["Pantheon · confirmado por você","var(--accent)"],ov:["Outras clínicas · confirmado por você","var(--ink)"],oc:["Outras clínicas · não está no faturamento","var(--ink)"],vf:["A verificar · nome parecido","var(--warn)"],vp:["A verificar · fora do período do faturamento","var(--warn)"]};
const ORGG={pan:["Pantheon",["pc","pn","pv"],"var(--accent)"],oc:["Outras clínicas",["oc","ov"],"#8C7B8F"],vf:["A verificar",["vf","vp"],"var(--warn)"]};
const SITC={M:"var(--loss)",R:"var(--warn)",A:"var(--accent)",P:"var(--gold)"};
const SITS={M:"Mantidas",R:"Em recurso",A:"Na AMHPDF",P:"Pendente de documentação"};
const MESN=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const csvq=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const n2=v=>v.toFixed(2).replace(".",",");

function mount(D,PAC,PER){
D.items.forEach(x=>{if(!MOT[x[9]])MOT[x[9]]=["Código não localizado na Tabela 38","nd"]});
const T=D.tot,I=D.items;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const group=(a,k)=>{const m=new Map();a.forEach(x=>{const key=k(x);if(!m.has(key))m.set(key,[]);m.get(key).push(x)});return m};
const catOf=k=>(MOT[k]||["","nd"])[1];
$("m-conv").textContent=D.conv.length;$("m-med").textContent=D.med.length;
if(!PAC.length){const fs=document.querySelectorAll("footer span");if(fs[1])fs[1].textContent="Descrições de motivos: Tabela 38 TUSS/TISS (ANS).";}

if(!I.length){$("kpis").innerHTML=kpiHTML([["Valor cobrado",brl(T.c),`${T.n.toLocaleString("pt-BR")} itens · ${T.guias} guias`,""],["Valor glosado",brl(0),"nenhum item glosado","loss"]]);
 $("qtabs").remove();$("qbody").innerHTML=`<div class="callout" style="background:var(--accent-soft)"><div class="eyebrow" style="color:var(--accent)">Sem glosas</div><p><b>Nenhum item foi glosado nesta quinzena.</b> Todo o valor cobrado (${brl(T.c)}) foi repassado.</p></div>`;return}

// ---------- origem ----------
const HASORG=PAC.length>0;
const nk=nkO;
const pacOf=new Map();
let PATS;
if(HASORG){PATS=PAC.map(p=>({...p,src:p,items:[]}));PATS.forEach(p=>[p.nome,...(p.var||[])].forEach(n=>pacOf.set(nk(n),p)))}
else{PATS=[];[...group(I,x=>nk(x[3]))].forEach(([k,a])=>{const p={nome:a[0][3],cls:"",items:[]};PATS.push(p);pacOf.set(k,p)})}
I.forEach(x=>{let p=pacOf.get(nk(x[3]));if(!p){p={nome:x[3],cls:"oc",items:[]};PATS.push(p);pacOf.set(nk(x[3]),p)}p.items.push(x)});
PATS=PATS.filter(p=>p.items.length);
const orgOfItem=new Map();PATS.forEach(p=>p.items.forEach(x=>orgOfItem.set(x,p)));
const ogrp=c=>Object.keys(ORGG).find(k=>ORGG[k][1].includes(c))||"oc";
const org=x=>HASORG?ogrp(orgOfItem.get(x).cls):"";
const mesOf=x=>x[4].slice(3);
const PG=new Set(I.filter(x=>x[10]==="P").map(x=>x[0]));const HASP=PG.size>0;

// ---------- estado ----------
const DIMS={org:x=>org(x),conv:x=>x[1],mot:x=>x[9],sit:x=>x[10],med:x=>x[2],mes:x=>mesOf(x),proc:x=>x[5]};
const DLAB={org:"Origem",conv:"Convênio",mot:"Motivo",sit:"Situação",med:"Médico",mes:"Atendimento",proc:"Procedimento",env:"Documentação",q:"Busca"};
const st=QS[PER]||(QS[PER]={F:{},tab:"res",open:new Set(),lim:40});
const F=st.F;
const match=(x,skip)=>{for(const d in DIMS){if(d===skip||!F[d])continue;const v=DIMS[d](x);if(d==="mot"){if(!F.mot.split(",").includes(v))return false}else if(v!==F[d])return false}
 if(skip!=="env"&&F.env&&!(PG.has(x[0])&&getEnv(PER,x[0])===F.env))return false;
 if(skip!=="q"&&F.q){const q=F.q.toLowerCase();if(!(x[0]+" "+x[3]+" "+x[6]+" "+x[5]+" "+x[1]).toLowerCase().includes(q))return false}
 return true};
const fI=skip=>I.filter(x=>match(x,skip));
const anyF=()=>Object.keys(F).some(k=>F[k]);
const labOf=(d,v)=>d==="org"?ORGG[v][0]:d==="sit"?SITS[v]||v:d==="mot"?v.split(",").map(k=>k).join(" + "):d==="mes"?(MESN[+v.slice(0,2)-1]+"/"+v.slice(3)):d==="proc"?((I.find(x=>x[5]===v)||[])[6]||v):v;
function setF(d,v,go){if(F[d]===v||v==null)delete F[d];else F[d]=v;st.lim=40;if(go)st.tab=go;renderAll(true)}

// ---------- KPIs ----------
function kpis(){const a=fI();const g=sum(a,x=>x[8]);const op=sum(a.filter(x=>x[10]!=="M"),x=>x[8]),mt=sum(a.filter(x=>x[10]==="M"),x=>x[8]);const ng=new Set(a.map(x=>x[0])).size;
 const f=anyF();
 $("kpis").innerHTML=kpiHTML([
  ["Valor cobrado",brl(T.c),`Repasse líquido ${brl(T.r)}`,""],
  [f?"Glosado no filtro":"Valor glosado",brl(g),f?`${pct(g,T.g)} do glosado da quinzena`:`${pct(T.g,T.c)} do cobrado`,"loss",f?g/T.g:T.g/T.c],
  ["Ainda dá para recuperar",brl(op),`Em recurso, na AMHPDF ou pendente de documento · ${pct(op,g)}`,"warnk"],
  ["Mantidas (perda)",brl(mt),`${pct(mt,g)} do glosado${f?" no filtro":""}`,""],
  ["Guias com glosa",`${ng} <span class="muted" style="font-size:1rem">de ${T.guias}</span>`,`${pl(a.length,"item glosado","itens glosados")}`,""]]);
}
function chips(){const box=$("qchips");const ks=Object.keys(F).filter(k=>F[k]);
 box.hidden=!ks.length;box.innerHTML=ks.length?`<span class="muted">Filtrando:</span>${ks.map(k=>`<button class="fchip" data-d="${k}" type="button">${DLAB[k]}: <b>${esc(k==="env"||k==="q"?F[k]:labOf(k,F[k]))}</b> <span aria-hidden="true">✕</span></button>`).join("")}<button class="fchip clear" data-d="*" type="button">Limpar tudo</button>`:""}
$("qchips").addEventListener("click",e=>{const b=e.target.closest(".fchip");if(!b)return;if(b.dataset.d==="*")Object.keys(F).forEach(k=>delete F[k]);else delete F[b.dataset.d];renderAll(true)});

// ---------- blocos reutilizáveis ----------
// lista de barras clicáveis: rows [{v,lab,sub,g,c,p}]
const blist=(d,rows,{max,cmax,head,limit})=>{const sel=F[d];const rs=limit?rows.slice(0,limit):rows;
 return `<div class="bars">${head?`<div class="bar head"><span>${head[0]}</span><span></span><span style="text-align:right">${head[1]}</span><span style="text-align:right">${head[2]}</span></div>`:""}${rs.map(r=>`<button type="button" class="bar click${sel===r.v?" on":""}${sel&&sel!==r.v?" dim":""}" data-d="${d}" data-v="${esc(r.v)}" title="Clique para filtrar"><div class="lab"><b>${r.lab}</b><span>${r.sub||""}</span></div><div class="track">${r.c!=null&&cmax?`<i class="c" style="width:${r.c/cmax*100}%"></i>`:""}<i style="width:${Math.max(r.g/(max||1)*100,.4)}%"></i></div><div class="val">${brl(r.g)}</div><div class="pct">${r.p}</div></button>`).join("")||`<div class="bar" style="grid-template-columns:1fr"><span class="muted">Nada neste filtro.</span></div>`}</div>`};
const stack=(d,parts,total)=>{const sel=F[d];return `<div class="stack">${parts.filter(p=>p.g>0).map(p=>`<button type="button" class="seg${sel===p.v?" on":""}${sel&&sel!==p.v?" dim":""}" data-d="${d}" data-v="${p.v}" style="--c:${p.c};flex:${p.g}" title="${esc(p.l)} · ${brl(p.g)}"></button>`).join("")}</div>
 <div class="sleg">${parts.map(p=>`<button type="button" class="sl${sel===p.v?" on":""}${sel&&sel!==p.v?" dim":""}" data-d="${d}" data-v="${p.v}"${p.g>0?"":" disabled"}><i style="background:${p.c}"></i><span class="l">${esc(p.l)}</span><span class="g">${brl(p.g)}</span><span class="s">${p.s||""} · ${pct(p.g,total)}</span></button>`).join("")}</div>`};

// ---------- conteúdo das abas ----------
const byMot=a=>[...group(a,x=>x[9])].map(([k,b])=>({k,n:b.length,g:sum(b,x=>x[8]),guias:new Set(b.map(x=>x[0])).size,conv:[...group(b,x=>x[1])].map(([c,z])=>[c,sum(z,x=>x[8])]).sort((p,q)=>q[1]-p[1])})).sort((a,b)=>b.g-a.g);
const motRows=a=>{const t=sum(a,x=>x[8]);return byMot(a).map(m=>({v:m.k,lab:`<span class="num muted" style="font-size:.78rem;margin-right:8px">${m.k}</span>${esc(MOT[m.k][0])}`,sub:`<span class="chip ${MOT[m.k][1]}">${CAT[MOT[m.k][1]]}</span> ${pl(m.n,"item","itens")} · ${pl(m.guias,"guia","guias")} · ${m.conv.slice(0,2).map(c=>esc(c[0])).join(", ")}`,g:m.g,p:pct(m.g,t)}))};
const convC=Object.fromEntries(D.conv.map(c=>[c[0],c[2]]));const medC=Object.fromEntries(D.med.map(c=>[c[0],c[2]]));
const convRows=(a,dim,CC)=>[...group(a,x=>dim==="conv"?x[1]:x[2])].map(([k,b])=>({v:k,lab:esc(k),sub:`${brl0(CC[k]||0)} cobrados · ${pl(b.length,"item glosado","itens glosados")}`,c:CC[k]||0,g:sum(b,x=>x[8]),p:pct(sum(b,x=>x[8]),CC[k]||0)})).sort((p,q)=>q.g-p.g);

function leitura(){const tm=byMot(I)[0];const tc=[...group(I,x=>x[1])].map(([k,b])=>[k,sum(b,x=>x[8])]).sort((p,q)=>q[1]-p[1])[0];
 const HINT={doc:"Costuma voltar enviando o documento no recurso.",aud:"Peça a justificativa ao convênio e responda com relatório médico.",cod:"Confira o faturamento antes de recorrer.",aut:"Recorra quando houver senha ou autorização arquivada.",val:"Melhor corrigir o preço no sistema.",nd:"Confirme o motivo com a AMHPDF."};
 const op=sum(I.filter(x=>x[10]!=="M"),x=>x[8]);const cents=I.filter(x=>(x[9]==="1705"||x[9]==="1714")&&x[8]<=1);
 const L=[
  [`O motivo que mais pesa é o <b>${tm.k}</b> (${esc(MOT[tm.k][0].toLowerCase())})`,`${brl(tm.g)}, ${pct(tm.g,T.g)} do glosado. ${HINT[catOf(tm.k)]}`,["mot",tm.k]],
  [`<b>${esc(tc[0])}</b> é o convênio que mais glosou`,`${brl(tc[1])}, ${pct(tc[1],T.g)} do glosado${convC[tc[0]]?`; de cada R$ 100 cobrados dele, R$ ${Math.round(tc[1]/convC[tc[0]]*100)} foram glosados`:""}.`,["conv",tc[0]]],
  [`<b>${brl(op)}</b> ainda podem voltar`,`São as glosas em recurso, na AMHPDF ou pendentes de documento. Só ${brl(T.g-op)} já estão mantidas.`,null]];
 if(cents.length)L.push([`<b>${pl(cents.length,"glosa","glosas")} de centavos</b> por preço acima da tabela`,`Somam ${brl(sum(cents,x=>x[8]))}. Não compensa recorrer: ajuste o preço no sistema.`,["mot","1705,1714"]]);
 return `<ul class="quick">${L.map(([h,t,f])=>`<li${f?` class="go" data-d="${f[0]}" data-v="${esc(f[1])}" tabindex="0" role="button"`:""}><span class="qh">${h}</span><span class="qt">${t}${f?` <span class="lk">Ver pacientes →</span>`:""}</span></li>`).join("")}</ul>`}

function tabRes(){const aS=fI("sit"),aO=fI("org"),aM=fI("mot"),aC=fI("conv");
 const sitParts=["A","R","P","M"].map(k=>{const b=aS.filter(x=>x[10]===k);let s=pl(new Set(b.map(x=>x[0])).size,"guia","guias");if(k==="P"&&b.length){const gs=[...new Set(b.map(x=>x[0]))];const en=gs.filter(g=>getEnv(PER,g)==="Enviado").length;s=`${en} enviada${en===1?"":"s"} · ${gs.length-en} pendente${gs.length-en===1?"":"s"}`}return {v:k,l:SITS[k],c:SITC[k],g:sum(b,x=>x[8]),s}});
 const orgParts=HASORG?Object.keys(ORGG).map(k=>{const b=aO.filter(x=>org(x)===k);return {v:k,l:ORGG[k][0],c:ORGG[k][2],g:sum(b,x=>x[8]),s:pl(new Set(b.map(x=>nk(x[3]))).size,"paciente","pacientes")}}):null;
 const mr=motRows(aM),cr=convRows(aC,"conv",convC);{const tg=sum(aC,x=>x[8]);cr.forEach(r=>r.p=pct(r.g,tg))}
 return `<div class="lead2"><div class="card"><div class="eyebrow">Leitura rápida</div>${leitura()}</div>
 <div class="card"><div class="ch"><div class="eyebrow">Situação das glosas</div><span class="hint">clique para filtrar</span></div>${stack("sit",sitParts,sum(aS,x=>x[8]))}
 ${HASORG?`<div class="ch" style="margin-top:22px"><div class="eyebrow">Origem dos pacientes</div><span class="hint">Pantheon × outras clínicas</span></div>${stack("org",orgParts,sum(aO,x=>x[8]))}`:""}</div></div>
 <div class="two"><div class="card"><div class="ch"><div class="eyebrow">Principais motivos</div>${mr.length>5?`<button class="lnk" data-tab="ana" type="button">ver todos (${mr.length}) →</button>`:""}</div>${blist("mot",mr,{max:mr[0]?.g,limit:5})}</div>
 <div class="card"><div class="ch"><div class="eyebrow">Convênios que mais glosaram</div>${cr.length>5?`<button class="lnk" data-tab="ana" type="button">ver todos (${cr.length}) →</button>`:""}</div>${blist("conv",cr,{max:cr[0]?.g,limit:5})}</div></div>`}

function tabAna(){const aM=fI("mot"),aC=fI("conv"),aD=fI("med"),aMe=fI("mes"),aP=fI("proc");
 const mr=motRows(aM),cr=convRows(aC,"conv",convC),dr=convRows(aD,"med",medC);
 const cmx=Math.max(...cr.map(r=>r.c),1),dmx=Math.max(...dr.map(r=>r.c),1);
 const pr=[...group(aP,x=>x[5])].map(([k,b])=>({v:k,lab:esc(b[0][6]),sub:`<span class="num">${k}</span> · ${pl(b.length,"item","itens")} · motivos ${[...new Set(b.map(x=>x[9]))].join(", ")}`,g:sum(b,x=>x[8]),p:pct(sum(b,x=>x[8]),sum(aP,x=>x[8]))})).sort((p,q)=>q.g-p.g).slice(0,12);
 const ms=[...group(aMe,x=>mesOf(x))].map(([k,b])=>[k,sum(b,x=>x[8]),b.length]).sort((a,b)=>(a[0].slice(3)+a[0].slice(0,2)).localeCompare(b[0].slice(3)+b[0].slice(0,2)));
 const mmx=Math.max(...ms.map(m=>m[1]),1);
 const mesH=`<div class="cols">${ms.map(([k,g,n])=>`<button type="button" class="col${F.mes===k?" on":""}${F.mes&&F.mes!==k?" dim":""}" data-d="mes" data-v="${k}" title="${pl(n,"item","itens")} · ${brl(g)}"><span class="cv">${brl0(g).replace("R$ ","")}</span><span class="cb"><i style="height:${Math.max(g/mmx*100,1.5)}%"></i></span><span class="cl">${MESN[+k.slice(0,2)-1]}/${k.slice(3)}</span></button>`).join("")}</div>`;
 return `<p class="sumline">Tudo aqui é clicável: escolha um motivo, convênio, médico, mês ou procedimento para filtrar o relatório inteiro e a lista de pacientes.</p>
 <div class="card"><div class="ch"><div class="eyebrow">Motivos · Tabela 38 TISS</div><div class="legend">${Object.entries(CAT).map(([k,v])=>`<span class="chip ${k}">${v}</span>`).join("")}</div></div>${blist("mot",mr,{max:mr[0]?.g,head:["Motivo","Glosado","% filtro"]})}</div>
 <div class="two"><div class="card"><div class="ch"><div class="eyebrow">Convênios</div><span class="hint">barra clara = cobrado · vermelha = glosado</span></div>${blist("conv",cr,{max:cmx,cmax:cmx,head:["Convênio","Glosado","Taxa"]})}</div>
 <div class="card"><div class="ch"><div class="eyebrow">Médicos</div></div>${blist("med",dr,{max:dmx,cmax:dmx,head:["Médico","Glosado","Taxa"]})}
 <div class="ch" style="margin-top:22px"><div class="eyebrow">Mês do atendimento</div></div>${mesH}</div></div>
 <div class="card"><div class="ch"><div class="eyebrow">Procedimentos mais glosados</div></div>${blist("proc",pr,{max:pr[0]?.g,head:["Procedimento","Glosado","% filtro"]})}</div>`}

// pacientes
function pacRows(){const a=fI();const keep=new Set(a);
 return PATS.map(p=>{const it=p.items.filter(x=>keep.has(x));return it.length?{p,it,g:sum(it,x=>x[8])}:null}).filter(Boolean).sort((x,y)=>y.g-x.g)}
const envSel=g=>{const v=getEnv(PER,g);return `<select class="env ${v==="Enviado"?"ok":"pend"}" data-g="${g}" aria-label="Documentação da guia ${g}"><option${v==="Pendente"?" selected":""}>Pendente</option><option${v==="Enviado"?" selected":""}>Enviado</option></select>`};
const sitTag=s=>SIT[s]?`<span class="stag" style="--c:${SITC[s]}">${SITS[s]}</span>`:"";
function tabPac(){const rows=pacRows();const g=sum(rows,r=>r.g);
 const o=(id,vals,all,d)=>`<label>${DLAB[d]}<select data-f="${d}"><option value="">${all}</option>${vals.map(([v,l])=>`<option value="${esc(v)}"${F[d]===v?" selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
 const cv=[...new Set(I.map(x=>x[1]))].sort(),mo=byMot(I).map(m=>[m.k,m.k+" · "+MOT[m.k][0]]),md=[...new Set(I.map(x=>x[2]))].sort();
 const fl=`<div class="filters">${HASORG?o("o",Object.entries(ORGG).map(([k,v])=>[k,v[0]]),"Todas","org"):""}${o("c",cv.map(c=>[c,c]),"Todos","conv")}${o("m",(F.mot&&F.mot.includes(",")?[[F.mot,F.mot.replace(/,/g," + ")]]:[]).concat(mo),"Todos","mot")}${o("s",Object.entries(SITS).filter(([k])=>I.some(x=>x[10]===k)).map(([k,v])=>[k,v]),"Todas","sit")}${o("d",md.map(c=>[c,c]),"Todos","med")}${HASP?o("e",[["Pendente","Pendente"],["Enviado","Enviado"]],"Todas","env"):""}
 <label class="grow">Buscar<input data-f="q" type="search" value="${esc(F.q||"")}" placeholder="Paciente, guia ou procedimento"></label></div>`;
 const head=`<tr><th></th><th style="text-align:left">Paciente</th>${HASORG?`<th style="text-align:left">Origem</th>`:""}<th style="text-align:left">Convênio</th><th>Atendimento</th><th>Guias</th><th>Glosado</th><th style="text-align:left">Motivos</th>${HASP?`<th style="text-align:left">Documentação</th>`:""}</tr>`;
 const nc=7+(HASORG?1:0)+(HASP?1:0);
 const body=rows.slice(0,st.lim).map(({p,it,g})=>{const k=nk(p.nome);const op=st.open.has(k);const gs=[...group(it,x=>x[0])];const pg=gs.map(([gn])=>gn).filter(gn=>PG.has(gn));
  const mots=[...group(it,x=>x[9])].map(([m,b])=>[m,sum(b,x=>x[8])]).sort((a,b)=>b[1]-a[1]);
  let h=`<tr class="pr${op?" open":""}" data-k="${esc(k)}" tabindex="0"><td class="cx"><span class="caret">›</span></td><td style="text-align:left;white-space:normal;min-width:170px"><b class="pn">${esc(p.nome)}</b></td>${HASORG?`<td style="text-align:left">${isVer(p.src||p)?origSel(p.src||p):`<span class="chip ${ogrp(p.cls)==="pan"?"pc":"oc"}" title="${esc(ORG[p.cls]?ORG[p.cls][0]:"")}">${ORGG[ogrp(p.cls)][0]}</span>`}</td>`:""}<td style="text-align:left;white-space:normal">${[...new Set(it.map(x=>x[1]))].map(esc).join("<br>")}</td><td class="n">${[...new Set(it.map(x=>x[4]))].slice(0,2).join("<br>")}</td><td class="n">${gs.length}</td><td class="n" style="color:var(--loss)"><b>${brl(g)}</b></td><td style="text-align:left;white-space:normal;min-width:150px">${mots.slice(0,4).map(([m])=>`<span class="chip ${MOT[m][1]}" title="${esc(MOT[m][0])}">${m}</span>`).join(" ")}${mots.length>4?` <span class="muted">+${mots.length-4}</span>`:""}</td>${HASP?`<td style="text-align:left">${pg.length?pg.map(gn=>`<div class="envg">${pg.length>1?`<span class="num">${gn}</span>`:""}${envSel(gn)}</div>`).join(""):`<span class="muted">—</span>`}</td>`:""}</tr>`;
  if(op)h+=`<tr class="det"><td></td><td colspan="${nc-1}"><div class="gdet">${gs.map(([gn,b])=>`<div class="gx"><div class="gxh"><span>Guia <b class="num">${gn}</b> · ${esc(b[0][1])} · ${esc(b[0][2])} · atend. ${b[0][4]}</span><span class="num" style="color:var(--loss)">${brl(sum(b,x=>x[8]))}</span></div>${b.map(x=>`<div class="gxi"><span class="d">${esc(x[6])} <span class="muted num">${x[5]}</span></span><span class="m"><span class="chip ${MOT[x[9]][1]}">${x[9]}</span> ${esc(MOT[x[9]][0])}</span><span>${sitTag(x[10])}</span><span class="num muted">${brl(x[7])}</span><span class="num" style="color:var(--loss)">${brl(x[8])}</span></div>`).join("")}</div>`).join("")}</div></td></tr>`;

let ATAB="qz";
function annualTabs(){const main=$("main");const secs=[...main.querySelectorAll(":scope > section")];
 const eb=s=>(s.querySelector(".eyebrow")||{}).textContent||"";
 const T=[["qz","Por quinzena"],["org","Pantheon × outras clínicas"],["rec","Recuperação"],["ana","Motivos, convênios e médicos"]];
 const where=s=>{if(s.id==="recsec")return "rec";const e=eb(s);if(s.querySelector(".kpis")&&!s.id&&/Valor cobrado/i.test(e))return null;
  if(/Pantheon ×|Origem dos pacientes/i.test(e))return "org";if(/Composição/i.test(e))return "rec";if(/Por quinzena/i.test(e))return "qz";if(s.classList.contains("two")||/Médicos|Motivos|Convênios/i.test(e))return "ana";return null};
 const has=new Set();secs.forEach(s=>{const t=where(s);if(t){s.dataset.atab=t;if(!s.hidden&&s.innerHTML.trim())has.add(t)}});
 const tabs=T.filter(([k])=>has.has(k));if(!tabs.length)return;if(!has.has(ATAB))ATAB=tabs[0][0];
 const first=secs.find(s=>s.dataset.atab);const nav=document.createElement("nav");nav.className="qtabs";nav.setAttribute("role","tablist");first.before(nav);
 const ap=()=>{nav.innerHTML=tabs.map(([k,l])=>`<button type="button" role="tab" class="tab${ATAB===k?" on":""}" data-t="${k}" aria-selected="${ATAB===k}">${l}</button>`).join("");
  secs.forEach(s=>{if(s.dataset.atab)s.style.display=s.dataset.atab===ATAB?"":"none"})};
 nav.addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;ATAB=b.dataset.t;ap();if(nav.getBoundingClientRect().top<0)nav.scrollIntoView({block:"start"})});ap()}

 document.querySelectorAll(".side a").forEach(a=>a.setAttribute("aria-current",a.dataset.k===key?"page":"false"));
